name: Bug report
description: Something is broken or behaving unexpectedly
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Remove tokens, thread IDs, and private paths from logs.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and the smallest reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Foreman version / commit
      placeholder: "0.1.0 or abc1234"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v24.18.0"
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options: [mock, t3, worker, not sure]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant portion. Do not include tokens or credentials.
      render: shell
