name: Feature request
description: Propose a capability or an integration
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - control plane / daemon
        - T3 adapter / lineage
        - leader / models
        - workers
        - dashboard / API
        - docs / packaging
        - other
    validations:
      required: true
